<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML & CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="q1">1. What does the acronym CSS stand for?</label>
            <input type="text" id="q1" name="q1">
            <label for="q2">2. How are id and class attributes selected in CSS?</label>
            <textarea name="q2" id="q2" rows="5"></textarea>
            <label for="q3">3. Which of the following is a valid CSS comment?</label>
            <select name="q3" id="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="answer1">&lt;!-- color: #fff --&gt;</option>
                <option value="answer2">/* color:fff */</option>
                <option value="answer3">// color:fff</option>
            </select>
            <label for="q4">4. What is the bottom margin given in this declaration?</label>
            <label for="q4dec">margin: 10px 5px 15px;</label>
            <input type="number" id="q4" name="q4">
            <button type="submit">Submit Quiz</button>
        </form>

    </main>
    <footer>
        This is a quiz for study purposes
    </footer>
</body>

</html>
