<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form - User Poll</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>

    <header>
        <h1>WDD 130 | HTML Form - User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset class="contact-info">
                <legend>Contact Information</legend>
                <div class="form-item column1">
                    <label for="fullname">Full Name:</label>
                    <input type="text " id="fullname" name="fullname" required>
                </div>
                <div class="form-item column1">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="email">
                </div>
            </fieldset>
            <fieldset class="questions">
                <legend>Questions</legend>
                <div class="form-item column2">
                    <label for="browser">What is your favorite internet browser?</label>
                    <select name="browser" id="browser">
                        <option value="chrome">Chrome</option>
                        <option value="edge">Edge</option>
                        <option value="safari">Safari</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-item column2">
                    <label>Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>
                <div class="form-item column3">
                    <label for="feedback">List the places you have lived:</label>
                    <textarea name="feedback" id="feedback" rows="5"
                      placeholder="Auckland New Zealand, Melbourne Australia, Perth Australia"></textarea>
                </div>
            </fieldset>
            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>© 2026 | HTML Form - User Poll Activity | Jacob'm Aniterea</p>
    </footer>

</body>

</html>
