<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Rapids Rafting Company</title>
    <meta name="description"
      content="Contact Rapids Rafting Company for bookings, questions, or group enquiries. Our team is here to help you plan the perfect river adventure.">
    <meta name="author" content="Jacob'm Aniterea">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/company-logo.jpg" alt="Rapids Rafting Company logo">
        <nav class="nav-spacing">
            <ul class="nav-list">
                <li><a href="index.html">HOME</a></li>
                <li><a href="about.html">ABOUT US</a></li>
                <li><a href="trips.html">TRIPS</a></li>
                <li><a href="contact.html">CONTACT US</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-grid">
        <section class="contact-info">
            <h1>CONTACT US</h1>
            <address>
                <p><strong>Rapids Rafting Company</strong></p>
                <p>159 Okere Road</p>
                <p>Okere Falls, New Zealand</p>
                <p>+64 1 234 5678</p>
                <p>info@therapids.co.nz</p>
            </address>
        </section>
        <section class="location-map">
            <iframe title="Map showing the location of Rapids Rafting Company"
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2018.551734163302!2d176.34326953528318!3d-38.020366977755906!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x6d6e840e4f8d4b11%3A0xfa1412533f0bc73d!2s159%20Okere%20Road%2C%20Okere%20Falls%203074%2C%20New%20Zealand!5e0!3m2!1sen!2sau!4v1770385988658!5m2!1sen!2sau"
              allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </section>
        <section class="contact-form">
            <form>
                <div class="form-row">
                    <label for="user-name">Name:</label>
                    <input type="text" id="user-name" name="user-name" required
                      placeholder="Joe Bloggs">
                </div>
                <div class="form-row">
                    <label for="user-email">Email:</label>
                    <input type="email" id="user-email" name="user-email" required
                      placeholder="example@mail.com">
                </div>
                <fieldset>
                    <label class="fieldset-title">Message Purpose</label>
                    <div class="radio-option">
                        <input type="radio" id="purpose-general" name="purpose" value="general">
                        <label for="purpose-general">General Inquiry</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="purpose-reservation" name="purpose"
                          value="reservation">
                        <label for="purpose-reservation">Reservation Question</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="purpose-suggestion" name="purpose"
                          value="suggestion">
                        <label for="purpose-suggestion">Website Suggestion</label>
                    </div>
                </fieldset>
                <div class="form-row-textarea">
                    <label for="message">Message:</label>
                    <textarea name="message" id="message" rows="5" placeholder="Type here"
                      required></textarea>
                </div>
                <div class="form-row-check">
                    <input type="checkbox" id="subscribe" name="subscribe">
                    <label for="subscribe">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit" class="btn contact-form-submit">Get in Touch!</button>
            </form>
        </section>
        <section class="team-grid">
            <h2>We Are Here To Serve You</h2>
            <figure>
                <img src="images/owner-photo.png" alt="Profile pic of owner John Snow">
                <figcaption>John - Owner</figcaption>
            </figure>
            <figure>
                <img src="images/safety-instructor-photo.png"
                  alt="Profile pic of safety instructor Ned Stark">
                <figcaption>Ned - Safety Instructor</figcaption>
            </figure>
            <figure>
                <img src="images/tour-guide-photo.png" alt="Profile pic of tour guide Sansa Stark">
                <figcaption>Sansa - Tour Guide</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>© 2026 | Rapids Rafting Company | Jacob'm Aniterea</p>
        <nav class="socialmedia">
            <a href="https://youtube.com">
                <img src="images/youtube-icon.svg" alt="YouTube Icon">
            </a>
            <a href="https://facebook.com">
                <img src="images/facebook-icon.svg" alt="Facebook Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-icon.svg" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
